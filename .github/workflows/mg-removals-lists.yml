name: MG Removals + Updated Lists (refresh)

on:
  schedule:
    # 02:00 & 08:00 UTC = 07:30 & 13:30 IST. Now FULLY headless: reads the Enforcement Hub
    # mirror sheet (shared with the SA) -> rebuilds "Remove from MG (<date>)" + the 6-list tab
    # + (enrolled minus removals). No hub login needed.
    - cron: "0 2,8 * * *"
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt

      - name: Refresh MG removals from Enforcement Hub mirror
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
        run: python mg_removal_from_mirror.py
