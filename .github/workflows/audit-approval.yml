name: CSPs Audit Approval refresh (hourly)

on:
  schedule:
    # Night pause 23:00-04:30 IST (key-972 warehouse cost, Nov 2026): nothing is scheduled
    # after 22:30 IST (GitHub can start a run late) or before 04:30, and the first run
    # is at 04:30-04:37 so the morning data is in by ~04:55. Runs (IST): 04:31 first, 22:07 last, 19 runs a day.
    # Was: 37 * * * *
    # every hour at :37 (staggered off the Data V2 job at :17). Idempotent (clear + rewrite).
    - cron: "37 0-16 * * *"
    - cron: "1,37 23 * * *"
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Refresh CSPs Audit Approval
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          SUPABASE_TOKEN: ${{ secrets.SUPABASE_TOKEN }}
          MB_KEY: ${{ secrets.MB_KEY }}
          CSP_1076_B64: ${{ secrets.CSP_1076_B64 }}
        run: python audit_approval_refresh.py
