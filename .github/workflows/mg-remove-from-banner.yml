name: MG remove-from-banner (daily 11pm IST)

on:
  schedule:
    # Night pause 23:00-04:30 IST (key-972 warehouse cost, Nov 2026): nothing is scheduled
    # after 22:30 IST (GitHub can start a run late) or before 04:30, and the first run
    # is at 04:30-04:37 so the morning data is in by ~04:55. Runs (IST): 22:30.
    # Was: 30 17 * * *
    - cron: "0 17 * * *"
  workflow_dispatch: {}

jobs:
  remove:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt

      # Reads the "Remove from MG" tab (CSPs flagged for MG removal on the Enforcement Hub)
      # and deletes those CSPs' rows from "Show Banner - Install MG" and "Show Banner - Sehat MG"
      # so they stop being shown the MG banner. Match on CSP ID (col A); header never touched.
      - name: Remove flagged CSPs from banner audience tabs
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
        run: python mg_remove_from_banner.py
