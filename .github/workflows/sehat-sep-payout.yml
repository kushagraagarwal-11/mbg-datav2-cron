name: Sehat MG Payout 16Aug-15Sep (nightly 12am IST)

on:
  schedule:
    # Night pause 23:00-04:30 IST (key-972 warehouse cost, Nov 2026): nothing is scheduled
    # after 22:30 IST (GitHub can start a run late) or before 04:30, and the first run
    # is at 04:30-04:37 so the morning data is in by ~04:55. Runs (IST): 04:31, 05:31.
    # Was: 30 18 * * *, 30 19 * * *
    - cron: "1 0,23 * * *"
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Rebuild Sehat MG Sep payout (FPV-excluded)
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
        run: python sehat_sep_payout.py
