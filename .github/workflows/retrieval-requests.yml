name: Retrieval requests — Delhi / Mumbai / Bharat (5x daily)

on:
  schedule:
    # 12:00 / 15:00 / 18:00 / 21:00 / 00:00 IST  =  06:30 / 09:30 / 12:30 / 15:30 / 18:30 UTC.
    # GitHub throttles scheduled runs, so the real firing time drifts later. The tabs are a
    # full rewrite and past dates come from the SCD2 trail, so a skipped tick costs nothing.
    - cron: "30 6,9,12,15,18 * * *"
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Rebuild retrieval-request tabs
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          MB_KEY: ${{ secrets.MB_KEY }}
        run: python retrieval_requests_tabs.py
