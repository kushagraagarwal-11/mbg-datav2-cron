name: Retrieval requests — Delhi / Mumbai / Bharat (daily 00:01 IST)

on:
  schedule:
    # Night pause 23:00-04:30 IST (key-972 warehouse cost, Nov 2026): nothing is scheduled
    # after 22:30 IST (GitHub can start a run late) or before 04:30, and the first run
    # is at 04:30-04:37 so the morning data is in by ~04:55. Runs (IST): 04:31.
    # Was: 31 18 * * *
    - cron: "1 23 * * *"
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Rebuild retrieval-request tabs
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          MB_KEY: ${{ secrets.MB_KEY }}
        run: python retrieval_requests_tabs.py
