name: Retrieval requests — Delhi / Mumbai / Bharat (daily 00:01 IST)

on:
  schedule:
    # 00:01 IST = 18:31 UTC the previous day. One run a day, just after midnight, so
    # every row covers a day that has fully closed. GitHub throttles scheduled runs and
    # may fire this late; the write is append-only and keyed on (date, csp), so a late or
    # skipped run just picks the missing days up next time.
    - cron: "31 18 * * *"
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Rebuild retrieval-request tabs
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          MB_KEY: ${{ secrets.MB_KEY }}
        run: python retrieval_requests_tabs.py
