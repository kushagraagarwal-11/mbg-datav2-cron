name: Netbox live refresh — cols J+L and Carry Fee CSPs (every 15 min)

on:
  schedule:
    # Night pause 23:00-04:30 IST (key-972 warehouse cost, Nov 2026): nothing is scheduled
    # after 22:30 IST (GitHub can start a run late) or before 04:30, and the first run
    # is at 04:30-04:37 so the morning data is in by ~04:55. Runs (IST): 04:37 first, 22:22 last, 72 runs a day.
    # Was: 7,22,37,52 * * * *
    - cron: "7-52/15 0-16,23 * * *"
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Refresh cols J + L (Charged & Pending Devices New)
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          MB_KEY: ${{ secrets.MB_KEY }}
        run: python netbox_status_sync.py

      # Runs even if the columns above failed — the two tabs are independent, and
      # both scripts are idempotent, so a partial tick self-heals on the next one.
      - name: Refresh Carry Fee CSPs tab (Overall / Delhi / Mumbai / Bharat)
        if: always()
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          MB_KEY: ${{ secrets.MB_KEY }}
        run: python carry_fee_csps_tab.py

      # Independent of the two above, and idempotent, so it runs regardless.
      - name: Refresh col L (non consented not returned - raw)
        if: always()
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          MB_KEY: ${{ secrets.MB_KEY }}
        run: python noncons_returned_sync.py

      # Independent of the steps above, and a full rewrite, so it runs regardless.
      - name: Rebuild Ret Pending tabs (CSP summary + Device level)
        if: always()
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          MB_KEY: ${{ secrets.MB_KEY }}
        run: python ret_pending_tabs.py
