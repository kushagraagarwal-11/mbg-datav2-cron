name: P1/P2 Winbacks — Pre/Post, main tab T:AA, Daily Dashboard (every 2h)

on:
  schedule:
    # every 2 hours at :53 UTC = 20:23, 22:23 ... IST; the laptop backup runs 19:13, 21:13 ... IST.
    # Moved from :43 on 14-Sep: that schedule never fired once in 8h (only manual runs did).
    # Replaces the laptop task WiomWinbackPrePost, which failed ~1 run in 3 on connection
    # resets and only ran while the laptop was on.
    - cron: "53 */2 * * *"
  workflow_dispatch: {}

# a slow run must never overlap the next one -- winback_prepost.py clears its tab first
concurrency:
  group: winback-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
      MB_KEY: ${{ secrets.MB_KEY }}
      NONCOMPLIANT_B64: ${{ secrets.NONCOMPLIANT_B64 }}
      WINBACK_BACKUP_DIR: /tmp          # runner is discarded; the backup only guards one run
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt

      # Each script computes everything before it writes, and every write is either a full
      # rebuild or a changed-cells-only update, so a retry after a transient failure is safe.
      # The steps are independent: one failing does not skip the others.
      #
      # Visit dates first: Exit + Visiting (89/Field) rows take their date of visit, soft
      # winback, CI and 750 from the Willing to Exit CSPs sheet, and the dashboards below
      # start those CSPs' post windows from that date.
      - name: Sync visit dates (Willing to Exit sheet -> tracker D, J, K, L)
        run: python sync_exit_visits.py || (sleep 90 && python sync_exit_visits.py)

      - name: Pre/Post Winback tab
        if: always()
        run: python winback_prepost.py || (sleep 90 && python winback_prepost.py)

      - name: Main tab T:AA (non-soft rows)
        if: always()
        run: python winback_maintab_prepost.py || (sleep 90 && python winback_maintab_prepost.py)

      - name: Daily Dashboard
        if: always()
        run: python daily_dashboard.py || (sleep 90 && python daily_dashboard.py)
