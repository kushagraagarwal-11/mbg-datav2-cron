name: "Six-live page refresh (every 2 h) -> csp-atoms-live.pages.dev"

on:
  schedule:
    - cron: "15 */2 * * *"
  workflow_dispatch: {}

concurrency:
  group: six-live-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -r requirements.txt
      - name: Pull inputs from Metabase and build the page
        env:
          MB_KEY: ${{ secrets.MB_KEY }}
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
        run: python six_live/refresh.py
      - name: Deploy to Cloudflare Pages (project csp-atoms-live)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages project create csp-atoms-live --production-branch main 2>/dev/null || true
          npx --yes wrangler@4 pages deploy six_live/out --project-name csp-atoms-live --branch main --commit-dirty=true
