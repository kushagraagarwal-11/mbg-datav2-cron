name: "Six-live page refresh (every 2 h) -> csp-atoms-live.pages.dev"

on:
  schedule:
    # Night pause 23:00-04:30 IST (key-972 warehouse cost, Nov 2026): nothing is scheduled
    # after 22:30 IST (GitHub can start a run late) or before 04:30, and the first run
    # is at 04:30-04:37 so the morning data is in by ~04:55. Runs (IST): 04:31 first, 21:45 last, 10 runs a day.
    # Was: 15 */2 * * *
    - cron: "15 0,2,4,6,8,10,12,14,16 * * *"
    - cron: "1 23 * * *"
  workflow_dispatch: {}

concurrency:
  group: six-live-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -r requirements.txt
      - name: Pull inputs from Metabase and build the page
        env:
          MB_KEY: ${{ secrets.MB_KEY }}
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
        run: python six_live/refresh.py
      - name: Deploy to Cloudflare Pages (project csp-atoms-live)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages project create csp-atoms-live --production-branch main 2>/dev/null || true
          npx --yes wrangler@4 pages deploy six_live/out --project-name csp-atoms-live --branch main --commit-dirty=true
