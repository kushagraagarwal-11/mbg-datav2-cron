name: Payout750 27-Aug tracker (hourly)

on:
  schedule:
    # Night pause 23:00-04:30 IST (key-972 warehouse cost, Nov 2026): nothing is scheduled
    # after 22:30 IST (GitHub can start a run late) or before 04:30, and the first run
    # is at 04:30-04:37 so the morning data is in by ~04:55. Runs (IST): 04:30 first, 22:30 last, 19 runs a day.
    # Was: 0 * * * *
    - cron: "0 0-17,23 * * *"
  workflow_dispatch: {}

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt

      # 27-Aug 750 campaign (92 CSPs, live 10:30) -> "Summary (27-Aug)" + "CSP Status (27-Aug)".
      - name: 27-Aug tracker → Summary + CSP Status
        env:
          CT_PASS: ${{ secrets.CT_PASS }}
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
        run: python payout750_aug27_tracker.py
