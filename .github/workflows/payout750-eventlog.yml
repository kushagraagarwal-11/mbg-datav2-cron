name: Payout750 event log (every 5 min)

on:
  schedule:
    # every 5 minutes — runs on GitHub's cloud (laptop can be off), public repo = free minutes.
    # GitHub's scheduler is best-effort: in practice it fires roughly every 5-15 min and can skip
    # under load. The jobs are idempotent (clear + rewrite / profile-upsert), so late runs are harmless.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt

      # 1) FAMILY-LEVEL suppression flag — write p750_decided=true to ALL identities of any
      #    cspid that opted in (DOMINANCE_CONSENT), so the banner stops for the whole family
      #    (owner + admin), not just the person who clicked. Profile writes fire nothing.
      #    Add to each flow's "Who": p750_decided does not equal true.
      - name: Family suppression flag (p750_decided)
        env:
          CT_PASS: ${{ secrets.CT_PASS }}
        run: python payout750_family_flag.py

      # 2) New-run tracker — ONLY the 19-Aug campaigns (Flow1 1787145338 / Flow2 1787145880 /
      #    Flow3 1787146027, live 19-Aug 18:45+). Scoped by ts >= 18:30 so yesterday is excluded.
      #    The 18-Aug tabs ("Event Log", "Summary (18 Aug)") are left FROZEN.
      - name: New-run tracker (19-Aug) → Event Log (19 Aug) + Summary (19 Aug)
        env:
          CT_PASS: ${{ secrets.CT_PASS }}
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          P750_FROM: "20260819"
          P750_RUN_FROM_TS: "20260819183000"
          P750_EVENTLOG_TAB: "Event Log (19 Aug)"
          P750_SUMMARY_TAB: "Summary (19 Aug)"
          P750_RUN_LABEL: "19 Aug new run"
        run: python payout750_eventlog_push.py

      # 3) Per-CSP who & when — one row per CSP: Opted In / Declined / Abandoned, the deciding
      #    role (owner-precedence, single, current role), and the time.
      - name: Who & when (19-Aug) → "Opt-ins & Declines — who & when (19 Aug)"
        env:
          CT_PASS: ${{ secrets.CT_PASS }}
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          P750_FROM: "20260819"
          P750_RUN_FROM_TS: "20260819183000"
          P750_WHO_TAB: "Opt-ins & Declines — who & when (19 Aug)"
        run: python payout750_who_when.py
