name: BD winback snapshot (daily 08:00 IST)

on:
  schedule:
    # 08:00 IST. GitHub throttles scheduled runs so the real firing time drifts later;
    # nothing in this report depends on the minute, only on which day it reads as.
    - cron: '30 2 * * *'
  workflow_dispatch:
    inputs:
      channel:
        description: 'Slack channel ID to post to (the bot must be invited there first)'
        required: false
        default: ''
      dm:
        description: 'DM this email instead. Needs users:read.email + im:write on the bot,
          which it does not have yet - a DM attempt returns missing_scope.'
        required: false
        default: ''
      dry_run:
        description: 'Render only, post nothing (images still attach to the run)'
        required: false
        default: 'false'

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install gspread google-auth requests matplotlib
      - name: Render + post the winback snapshot
        env:
          # Project Dominance bot, same one the device-recovery funnel posts with.
          SLACK_BOT_TOKEN: ${{ secrets.PAYOUT750_SLACK_TOKEN }}
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          MB_KEY: ${{ secrets.MB_KEY }}
          # A channel is the only destination that works today: the Project Dominance bot has
          # only ever posted to channels, so it lacks users:read.email and a DM attempt comes
          # back missing_scope. Grant that plus im:write and reinstall if you want DMs.
          # The bot must be a member of whichever channel this is, or the upload returns
          # not_in_channel.
          SLACK_CHANNEL_ID: ${{ github.event.inputs.channel || secrets.BD_SNAPSHOT_CHANNEL_ID }}
          SNAP_DM: ${{ github.event.inputs.dm }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
        run: python bd_winback_snapshot.py
      - name: Keep the images on the run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: winback-snapshot
          path: out/*.png
          retention-days: 14
