name: BD winback snapshot (daily 08:00 IST)

on:
  schedule:
    # Target is 08:00 IST, but GitHub's scheduler is best-effort and on this repo it misses
    # badly: the device funnel's 15:30 cron has fired anywhere from 18:40 to 21:18, and this
    # job's single 02:30 slot fired once 6h16m late and then skipped a day outright.
    #
    # So fire from four slots and let the script no-op when today's summary is already in the
    # channel - whichever slot actually runs first does the work. Odd minutes on purpose; the
    # top and the half of the hour are the congested ones. The report is about YESTERDAY, so
    # an early slot is not a wrong number, only an early one.
    - cron: '7 1 * * *'     # 06:37 IST - primary; an hour of drift still lands before 08:00
    - cron: '17 2 * * *'    # 07:47 IST
    - cron: '23 3 * * *'    # 08:53 IST
    - cron: '43 5 * * *'    # 11:13 IST - last resort, so a bad morning still reports
  workflow_dispatch:
    inputs:
      preview_user:
        description: 'Slack USER id to preview to. Sends EVERYTHING to just that person and
          nothing to the owners or the channel. Palak = U08RVLH5QS3'
        required: false
        default: ''
      check_only:
        description: 'Verify the bot can reach every DM and the channel. Sends NOTHING.'
        required: false
        default: 'true'
      dry_run:
        description: 'Render only, post nothing (images still attach to the run)'
        required: false
        default: 'false'
      force:
        description: 'Post again even if today''s snapshot already went out.'
        required: false
        default: 'false'

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install gspread google-auth requests matplotlib
      - name: Render + post the winback snapshot
        env:
          # Project Dominance bot, the same one the device-recovery funnel posts with.
          SLACK_BOT_TOKEN: ${{ secrets.PAYOUT750_SLACK_TOKEN }}
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          MB_KEY: ${{ secrets.MB_KEY }}
          # #execution-leadership - the channel the 21:00 funnel already posts to. It gets the
          # all-owners summary plus every owner's sheet; each owner gets only his own, by DM.
          SLACK_CHANNEL_ID: ${{ secrets.DEVICE_FUNNEL_CHANNEL_ID }}
          PREVIEW_USER: ${{ github.event.inputs.preview_user }}
          CHECK_ONLY: ${{ github.event.inputs.check_only == 'true' && '1' || '0' }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
          FORCE: ${{ github.event.inputs.force == 'true' && '1' || '0' }}
        run: python bd_winback_snapshot.py
      - name: Keep the images on the run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: winback-snapshot
          path: out/*.png
          retention-days: 14
